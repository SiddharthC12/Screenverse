<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#252A36"/>
      <stop offset="70%" stop-color="#161820"/>
      <stop offset="100%" stop-color="#101116"/>
    </radialGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5BE72"/>
      <stop offset="50%" stop-color="#C9A45C"/>
      <stop offset="100%" stop-color="#9E7D36"/>
    </linearGradient>
    <linearGradient id="goldRing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A45C"/>
      <stop offset="50%" stop-color="#F5F3EE"/>
      <stop offset="100%" stop-color="#C9A45C"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <circle cx="100" cy="100" r="98" fill="url(#bgGlow)"/>
  <circle cx="100" cy="100" r="97" stroke="url(#goldGradient)" stroke-width="3" stroke-opacity="0.8"/>
  <circle cx="100" cy="100" r="92" stroke="#101116" stroke-width="2"/>

  <!-- Film Reel Outer Rim -->
  <circle cx="100" cy="100" r="82" stroke="url(#goldGradient)" stroke-width="4.5"/>
  <circle cx="100" cy="100" r="74" stroke="url(#goldGradient)" stroke-width="1.5" stroke-dasharray="3 3" stroke-opacity="0.6"/>

  <!-- Film Sprocket / Perimeter Cutouts -->
  <!-- 8 circular reel cutouts -->
  <g fill="#161820" stroke="url(#goldGradient)" stroke-width="2">
    <circle cx="100" cy="46" r="14"/>
    <circle cx="138" cy="62" r="14"/>
    <circle cx="154" cy="100" r="14"/>
    <circle cx="138" cy="138" r="14"/>
    <circle cx="100" cy="154" r="14"/>
    <circle cx="62" cy="138" r="14"/>
    <circle cx="46" cy="100" r="14"/>
    <circle cx="62" cy="62" r="14"/>
  </g>

  <!-- Small accent perforation dots inside cutouts -->
  <g fill="#E5BE72">
    <circle cx="100" cy="46" r="3"/>
    <circle cx="138" cy="62" r="3"/>
    <circle cx="154" cy="100" r="3"/>
    <circle cx="138" cy="138" r="3"/>
    <circle cx="100" cy="154" r="3"/>
    <circle cx="62" cy="138" r="3"/>
    <circle cx="46" cy="100" r="3"/>
    <circle cx="62" cy="62" r="3"/>
  </g>

  <!-- Central Hub -->
  <circle cx="100" cy="100" r="28" fill="#1D2028" stroke="url(#goldGradient)" stroke-width="3.5"/>
  <circle cx="100" cy="100" r="20" stroke="url(#goldRing)" stroke-width="1.5" stroke-opacity="0.9"/>
  <circle cx="100" cy="100" r="9" fill="url(#goldGradient)"/>

  <!-- 4-point subtle cinema star in center -->
  <path d="M100 89 L102 98 L111 100 L102 102 L100 111 L98 102 L89 100 L98 98 Z" fill="#101116"/>
</svg>
